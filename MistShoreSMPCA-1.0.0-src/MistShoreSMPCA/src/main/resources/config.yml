# MistShoreSMPCA
# 改完执行 /msca reload 就能生效，不用重启

damage:
  # 要不要改重生锚的爆炸伤害
  enabled: true

  # MULTIPLIER：在原版伤害上乘个倍率，离得越远伤害越低这点不变
  # FIXED：不管远近，基础伤害直接定死
  mode: MULTIPLIER

  # MULTIPLIER 下 0.5 就是原版的一半
  # FIXED 下按血量算，2.0 是一颗心，之后还要过护甲、保护和抗性
  value: 0.5

explosion:
  # 锚炸了会不会破坏地形，关掉以后只剩伤害和击退
  break-terrain: false

crafting:
  # 禁止合成重生锚，工作台和自动合成器都拦
  block-respawn-anchor: false

  # 禁止合成末影水晶
  block-end-crystal: false
